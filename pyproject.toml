[project]
name = "svuvm"
dynamic = ["version"]
description = "Hardware verification framework enabling Python to call SystemVerilog UVM APIs for writing test cases and dynamically configuring verification environments"
authors = [
    { name = "Dragon-Git", email = "1762578117@qq.com" }
]
dependencies = []
readme = "README.md"
requires-python = ">= 3.9"

[project.optional-dependencies]
build = ["setuptools_scm>=8.0, <9.0"]
lint = ['ruff']
doc = ['sphinx']
test = ['pytest', 'coverage', 'pytest-cov']
dev = ['svuvm[build, lint, doc, test]']

[build-system]
requires = [
    "scikit-build-core>=1.0.0, <2.0.0",
    "nanobind>=2.4.0, <4.0.0",
    "pyslang>=11.0.0, <12.0.0",
    "setuptools_scm>=8.0, <9.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.15"
build.verbose = true
logging.level = "INFO"

# Standard PEP 621 dynamic-metadata hook: tell scikit-build-core to
# delegate version resolution to setuptools_scm. Without this, the
# build fails with:
#   AssertionError: project.version is not specified, must be
#   statically present or tool.scikit-build metadata.version.provider
#   configured when dynamic
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
# Read version from git tags of the form vX.Y.Z or vX.Y.Z-rcN
tag_regex = "^v(?P<version>[\\d.]+(-[\\w.]+)?)$"
# Also write the resolved version into src/svuvm/_version.py
write_to = "src/svuvm/_version.py"
# Fallback when git is unavailable (e.g., sdist download from PyPI)
fallback_version = "0.0.0+unknown"
# Make `pip install .` on an arbitrary commit produce a usable PEP 440 version
local_scheme = "node-and-date"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# BLE001: existing tests use bare `except Exception:` blocks; defer
#         the per-call-site rewrites to a dedicated cleanup commit.
# EXE001: scripts/*.py have shebangs but are invoked via `python <path>`,
#         not executed directly; the executable bit is intentionally
#         not set.
# I001 : import sorting — disabled in this commit to keep the diff
#         small. A follow-up commit can run `ruff check --fix` and
#         accept the re-sorted imports across the codebase.
# RUF100: existing `# noqa: F401` directives on `try/except`-wrapped
#         imports in `__init__.py` are intentional (F401 would otherwise
#         flag them) but ruff 0.6+ considers them unused in this
#         specific pattern. Re-evaluate after migrating to
#         `__getattr__`-based lazy imports.
ignore = ["BLE001", "EXE001", "I001", "RUF100"]

[tool.ruff.lint.pydocstyle]
    convention = "google"
