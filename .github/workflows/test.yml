name: Test

on:
  push:
    branches: [ "main" ]
    tags: ["*"]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # runner.arch is part of every cache key below: amd64 and arm64 both
        # report runner.os = Linux and must not share a ccache.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-26]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-vlt
      OBJCACHE: ccache
      SKBUILD_CMAKE_ARGS: >-
        -DCMAKE_C_COMPILER_LAUNCHER=${{ github.workspace }}/ccwrap;-DCMAKE_CXX_COMPILER_LAUNCHER=${{ github.workspace }}/ccwrap
    steps:
    - uses: actions/checkout@v7
      with:
        # setuptools_scm needs the tags to resolve the version.
        fetch-depth: 0

    # Exports VERILATOR_ROOT, which svuvm.cpp and the generated Vtop.mk read.
    - name: Set up Verilator
      uses: ktbarrett/setup-verilator@dev
      with:
        version: 'nightly'

    - name: Show Verilator version
      run: verilator --version

    # The action unpacks into a randomly named directory, and that path is in
    # every -I of every compile line, so it changed ccache's key on every run:
    # with OBJCACHE wired the next run still missed 40 of 40. RUNNER_TEMP is
    # the action's parent directory, so this is a rename, not a copy.
    - name: Pin the Verilator prefix
      run: |
        dst="$RUNNER_TEMP/verilator"
        mv "$(dirname "$(dirname "$VERILATOR_ROOT")")" "$dst"
        echo "VERILATOR_ROOT=$dst/share/verilator" >> "$GITHUB_ENV"
        echo "$dst/bin" >> "$GITHUB_PATH"

    # The nightly's installed verilated.mk hardcodes "OBJCACHE = " - the
    # packager rewrites ?= to = - so a makefile assignment beats the env var
    # above and every Verilator C++ line ran bare. The grep fails loudly if
    # the file's shape ever changes again.
    - name: Point Verilator's OBJCACHE at ccache
      run: |
        mk="$VERILATOR_ROOT/include/verilated.mk"
        case "$RUNNER_OS" in
          macOS) sed -i '' 's/^OBJCACHE = .*/OBJCACHE = ccache/' "$mk" ;;
          *)     sed -i     's/^OBJCACHE = .*/OBJCACHE = ccache/' "$mk" ;;
        esac
        grep -n '^OBJCACHE' "$mk"

    - name: Cache ccache (verilator tests)
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.ccache-vlt
        key: ccache-vlt-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-${{ hashFiles('src/**', 'test/**', 'inc/**', 'pyproject.toml') }}
        restore-keys: ccache-vlt-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-

    - name: Cache ccache (wheel build)
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.ccache-whl
        key: ccache-whl-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-${{ github.sha }}
        restore-keys: ccache-whl-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-

    - name: Install dependencies on Ubuntu
      if: startsWith(matrix.os, 'ubuntu-')
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ccache g++ make
        ccache --set-config=max_size=2G
        ccache -z

    - name: Install dependencies on macOS
      if: matrix.os == 'macos-26'
      run: |
        brew install ccache
        ccache --set-config=max_size=2G
        ccache -z

    - name: Clone verilator-uvm repository
      run: |
        git clone https://github.com/Dragon-Git/uvm-verilator.git

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up ccache wheel wrapper
      run: |
        printf '#!/bin/sh\nCCACHE_DIR=%s/.ccache-whl exec ccache "$@"\n' "${{ github.workspace }}" > "${{ github.workspace }}/ccwrap"
        chmod +x "${{ github.workspace }}/ccwrap"
        CCACHE_DIR="${{ github.workspace }}/.ccache-whl" ccache --set-config=max_size=500M
        CCACHE_DIR="${{ github.workspace }}/.ccache-whl" ccache -z

    - name: Install Python dependencies
      # No build isolation: under PEP 517 pip builds in a random
      # /tmp/pip-build-env-*/, and that path lands in every compile command,
      # so ccache's key changed on every run (12 of 13 calls missed). The
      # requirements below mirror [build-system].requires in pyproject.toml.
      #
      # nanobind 3.0.0 raises ImportError on Python < 3.10, so 3.9 pins 2.4.x
      # directly - there is no isolated environment left for a PIP_CONSTRAINT
      # to reach. The old constraint file also named nanobind-backend, which
      # is not a distribution: a constraint may do that, an install cannot.
      run: |
        python -m pip install --upgrade pip
        if [ "${{ matrix.python-version }}" = "3.9" ]; then
          python -m pip install 'nanobind==2.4.0'
        else
          python -m pip install 'nanobind>=2.4.0,<4.0.0'
        fi
        python -m pip install 'scikit-build-core>=1.0.0,<2.0.0' \
                              'pyslang>=11.0.0,<12.0.0' \
                              'setuptools_scm>=8.0,<11.0'
        python -m pip install --no-build-isolation -v .
        python -m pip install cocotb

    - name: Lint with ruff
      uses: astral-sh/ruff-action@v4.1.0

    - name: Run base test
      run: |
        make -f test/base_test/Makefile run

    - name: Run cocotb test
      run: |
        make -f test/cocotb_test/Makefile run

    - name: Show ccache stats
      run: |
        echo "== verilator tests =="
        CCACHE_DIR="${{ github.workspace }}/.ccache-vlt" ccache -s
        echo "== wheel build =="
        CCACHE_DIR="${{ github.workspace }}/.ccache-whl" ccache -s

  # One build per architecture, as a job of its own rather than a matrix leg,
  # so that each consumer needs() exactly one of them: `needs` on a matrix
  # covers all of its cells, and the binaries are not interchangeable anyway.
  #
  # Release assets, for when a release is new enough instead of main:
  #   ubuntu-latest      xezim-manylinux_2_34_x86_64-0.11.1.tar.gz
  #   ubuntu-24.04-arm   xezim-manylinux_2_34_aarch64-0.11.1.tar.gz
  #   macos-26           xezim-macos-arm64-0.11.1.tar.gz
  xezim-build-linux-x64:
    name: xezim build (ubuntu-latest)
    uses: ./.github/workflows/xezim-build.yml
    with:
      os: ubuntu-latest

  xezim-build-linux-arm64:
    name: xezim build (ubuntu-24.04-arm)
    uses: ./.github/workflows/xezim-build.yml
    with:
      os: ubuntu-24.04-arm

  xezim-build-macos:
    name: xezim build (macos-26)
    uses: ./.github/workflows/xezim-build.yml
    with:
      os: macos-26

  xezim-test-linux-x64:
    name: xezim-test (ubuntu-latest)
    needs: xezim-build-linux-x64
    uses: ./.github/workflows/xezim-tests.yml
    with:
      os: ubuntu-latest

  xezim-test-linux-arm64:
    name: xezim-test (ubuntu-24.04-arm)
    needs: xezim-build-linux-arm64
    uses: ./.github/workflows/xezim-tests.yml
    with:
      os: ubuntu-24.04-arm

  xezim-test-macos:
    name: xezim-test (macos-26)
    needs: xezim-build-macos
    uses: ./.github/workflows/xezim-tests.yml
    with:
      os: macos-26

  # UVM version compatibility: the same bridge against every UVM release the
  # project supports, so an upstream regression shows up as a version that
  # stopped working. xezim interprets, so it runs the base test per version;
  # Verilator is elaboration only (see its job), so its cells lint per
  # version. Ten xezim jobs would be ten setups for eighty seconds of
  # testing, so those versions are steps in one job; a lint is seconds, so its
  # cells stay parallel and a failure points at its version.
  uvm-compat-verilator:
    # Elaboration only: upstream UVM gains a Verilator backend in 2020-3.2, so
    # earlier versions cannot build here at all. Lint still compares the
    # bridge's SystemVerilog surface against every version.
    runs-on: ubuntu-latest
    strategy:
      # A version that fails says nothing about the others.
      fail-fast: false
      matrix:
        include:
          # The three that fail do so outside this bridge
          # (docs/uvm-version-compatibility.md); cells, not omissions, so the
          # boundary stays visible.
          - { uvm: uvm-1.0p1,    expect: fail }
          - { uvm: uvm-1.1a,     expect: pass }
          - { uvm: uvm-1.1b,     expect: fail }
          - { uvm: uvm-1.1c,     expect: fail }
          - { uvm: uvm-1.1d,     expect: pass }
          - { uvm: uvm-1.2,      expect: pass }
          - { uvm: uvm-2017-0.9, expect: pass }
          - { uvm: uvm-2017-1.0, expect: pass }
          - { uvm: uvm-2017-1.1, expect: pass }
          - { uvm: uvm-2020-1.0, expect: pass }
          - { uvm: uvm-2020-1.1, expect: pass }
          - { uvm: uvm-2020-2.0, expect: pass }
          - { uvm: uvm-2020-3.0, expect: pass }
          - { uvm: uvm-2020-3.1, expect: pass }
          - { uvm: uvm-2020-3.2, expect: pass }

    name: uvm-compat (verilator, ${{ matrix.uvm }})

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install '.[test]' -q

    - name: Set up Verilator
      uses: ktbarrett/setup-verilator@dev
      with:
        version: 'nightly'

    - name: Fetch UVM ${{ matrix.uvm }}
      run: |
        git clone --quiet --depth 1 --branch "${{ matrix.uvm }}" \
          https://github.com/chipsalliance/uvm-verilator.git "$RUNNER_TEMP/uvm"

    - name: Lint the bridge against UVM ${{ matrix.uvm }}
      env:
        # This leg is given the src directory itself.
        UVM_HOME: ${{ runner.temp }}/uvm/src
      run: script/uvm_compat_check.sh verilator "${{ matrix.uvm }}" "${{ matrix.expect }}" lint

  uvm-compat-xezim:
    needs: xezim-build-linux-x64
    # Ten versions, ten steps in one job - see the note on the Verilator leg.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install '.[test]' -q

    # Named after this job's own runner, i.e. the build job it needs.
    - name: Get the xezim build
      uses: actions/download-artifact@v8
      with:
        name: xezim-${{ runner.os }}-${{ runner.arch }}
        path: ${{ runner.temp }}/xezim-prefix

    - name: Make xezim runnable
      run: |
        # An artifact does not carry the executable bit.
        chmod +x "$RUNNER_TEMP/xezim-prefix/bin/xezim"
        echo "XEZIM_PREFIX=$RUNNER_TEMP/xezim-prefix" >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/xezim-prefix/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/xezim-prefix/bin/xezim" -V

    # One shallow clone per version, up front: they are 5-26 MB each, and
    # doing it here keeps each version's step to the test alone.
    - name: Fetch the UVM versions
      run: |
        for tag in uvm-1.2 uvm-2017-0.9 uvm-2017-1.0 uvm-2017-1.1 \
                   uvm-2020-1.0 uvm-2020-1.1 uvm-2020-2.0 uvm-2020-3.0 \
                   uvm-2020-3.1 uvm-2020-3.2; do
          git clone --quiet --depth 1 --branch "$tag" \
            https://github.com/chipsalliance/uvm-verilator.git "$RUNNER_TEMP/uvm/$tag" &
        done
        wait
        ls "$RUNNER_TEMP/uvm"

    # One step per version, so a failure points at its version; each step is
    # green when its result matches the expectation, known fails included.
    # UVM_HOME is the tag directory here; this leg's Makefile appends /src.
    - name: uvm-1.2
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-1.2' }
      run: script/uvm_compat_check.sh xezim uvm-1.2 pass
    - name: uvm-2017-0.9 (known failing)
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2017-0.9' }
      run: script/uvm_compat_check.sh xezim uvm-2017-0.9 fail
    - name: uvm-2017-1.0
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2017-1.0' }
      run: script/uvm_compat_check.sh xezim uvm-2017-1.0 pass
    - name: uvm-2017-1.1
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2017-1.1' }
      run: script/uvm_compat_check.sh xezim uvm-2017-1.1 pass
    - name: uvm-2020-1.0
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2020-1.0' }
      run: script/uvm_compat_check.sh xezim uvm-2020-1.0 pass
    - name: uvm-2020-1.1
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2020-1.1' }
      run: script/uvm_compat_check.sh xezim uvm-2020-1.1 pass
    - name: uvm-2020-2.0
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2020-2.0' }
      run: script/uvm_compat_check.sh xezim uvm-2020-2.0 pass
    - name: uvm-2020-3.0
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2020-3.0' }
      run: script/uvm_compat_check.sh xezim uvm-2020-3.0 pass
    - name: uvm-2020-3.1
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2020-3.1' }
      run: script/uvm_compat_check.sh xezim uvm-2020-3.1 pass
    - name: uvm-2020-3.2
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2020-3.2' }
      run: script/uvm_compat_check.sh xezim uvm-2020-3.2 pass
