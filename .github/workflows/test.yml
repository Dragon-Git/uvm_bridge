name: Test

on:
  push:
    branches: [ "main" ]
    tags: ["*"]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-26]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-vlt
      OBJCACHE: ccache
      SKBUILD_CMAKE_ARGS: >-
        -DCMAKE_C_COMPILER_LAUNCHER=${{ github.workspace }}/ccwrap;-DCMAKE_CXX_COMPILER_LAUNCHER=${{ github.workspace }}/ccwrap
    steps:
    - uses: actions/checkout@v7
      with:
        # setuptools_scm needs full git history to resolve the version
        # from tags; shallow clones trigger "is shallow and may cause
        # errors" warnings and produce incorrect dev versions.
        fetch-depth: 0

    # The action installs to a fresh prefix per run and, for both Linux and
    # macOS, exports VERILATOR_ROOT for it and puts it on PATH. That is the
    # variable svuvm.cpp reads and the one the generated Vtop.mk needs to find
    # verilated.mk, so no separate pinning step is required.
    - name: Set up Verilator
      uses: ktbarrett/setup-verilator@dev
      with:
        version: 'nightly'

    - name: Show Verilator version
      run: verilator --version

    - name: Cache ccache (verilator tests)
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.ccache-vlt
        key: ccache-vlt-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('src/**', 'test/**', 'inc/**', 'pyproject.toml') }}
        restore-keys: ccache-vlt-${{ runner.os }}-${{ matrix.python-version }}-

    - name: Cache ccache (wheel build)
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.ccache-whl
        key: ccache-whl-${{ runner.os }}-${{ matrix.python-version }}-${{ github.sha }}
        restore-keys: ccache-whl-${{ runner.os }}-${{ matrix.python-version }}-

    - name: Install dependencies on Ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ccache g++ make
        ccache --set-config=max_size=2G
        ccache -z

    - name: Install dependencies on macOS
      if: matrix.os == 'macos-26'
      run: |
        brew install ccache
        ccache --set-config=max_size=2G
        ccache -z

    - name: Clone verilator-uvm repository
      run: |
        git clone https://github.com/Dragon-Git/uvm-verilator.git

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up ccache wheel wrapper
      run: |
        printf '#!/bin/sh\nCCACHE_DIR=%s/.ccache-whl exec ccache "$@"\n' "${{ github.workspace }}" > "${{ github.workspace }}/ccwrap"
        chmod +x "${{ github.workspace }}/ccwrap"
        CCACHE_DIR="${{ github.workspace }}/.ccache-whl" ccache --set-config=max_size=500M
        CCACHE_DIR="${{ github.workspace }}/.ccache-whl" ccache -z

    - name: Install Python dependencies
      # nanobind 3.0.0 (Aug 2026) raises ImportError at import
      # time on Python < 3.10 because its stable ABI floor
      # moved up to 3.10. pyproject.toml advertises
      # nanobind>=2.4.0,<4.0.0 (per Dependabot PR #26) which
      # pip happily resolves to 3.0.0 even on Python 3.9,
      # causing the wheel build to fail. On 3.9 we constrain
      # pip (in both the main and the isolated build env) to
      # nanobind 2.4.x via a PEP 665-style constraints file
      # written to a temp file. PIP_CONSTRAINT applies to
      # every pip invocation in this step, including the
      # build-time resolver that PEP 517's isolated build
      # creates, so the sdist build cannot re-resolve
      # nanobind to 3.0.0. On every other Python version
      # PIP_CONSTRAINT is not set, so 3.0.0 is picked
      # normally.
      run: |
        python -m pip install --upgrade pip
        if [ "${{ matrix.python-version }}" = "3.9" ]; then
          printf '%s\n%s\n' 'nanobind==2.4.0' 'nanobind-backend==2.4.0' > /tmp/nb39.txt
          PIP_CONSTRAINT=/tmp/nb39.txt python -m pip install . -v
        else
          python -m pip install . -v
        fi
        python -m pip install cocotb

    - name: Lint with ruff
      uses: astral-sh/ruff-action@v4.1.0

    - name: Run base test
      run: |
        make -f test/base_test/Makefile run

    - name: Run cocotb test
      run: |
        make -f test/cocotb_test/Makefile run

    - name: Show ccache stats
      run: |
        echo "== verilator tests =="
        CCACHE_DIR="${{ github.workspace }}/.ccache-vlt" ccache -s
        echo "== wheel build =="
        CCACHE_DIR="${{ github.workspace }}/.ccache-whl" ccache -s

  xezim-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            xezim_asset: xezim-manylinux_2_34_x86_64-0.11.1.tar.gz
          - os: macos-26
            xezim_asset: xezim-macos-arm64-0.11.1.tar.gz
    env:
      XEZIM_VERSION: 0.11.1
    steps:
    - uses: actions/checkout@v7
      with:
        # setuptools_scm needs full git history to resolve the version
        # from tags; shallow clones trigger "is shallow and may cause
        # errors" warnings and produce incorrect dev versions.
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # The test extra carries what the register tests need to build their
        # inputs: peakrdl (RTL, C header, PyRAL model) and unicorn.
        python -m pip install '.[test]' -v

    # Built from main rather than taken from a release: the work this test
    # needs is on main and is newer than 0.11.1. Switch back to the release
    # tarball once a release contains it - the matrix `xezim_asset` entries
    # are the record of what that would be.
    #
    # The build is shared with uvm-compat-build, which needs the same binary:
    # same path, same key, so whichever job gets there first builds and the
    # other restores it. Building xezim is the most expensive step in this
    # workflow and was previously done once per job that needed it. The key
    # carries the runner OS, because this job runs on two of them and their
    # binaries are not interchangeable.
    - name: Resolve the xezim revision
      id: rev
      run: |
        sha=$(git ls-remote https://github.com/aionhw/xezim.git refs/heads/main | cut -f1)
        test -n "$sha" || { echo "could not resolve xezim main"; exit 1; }
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "xezim main is $sha"

    - name: Restore the xezim build
      id: xezim-cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/xezim-prefix
        key: xezim-${{ runner.os }}-${{ steps.rev.outputs.sha }}

    - name: Build xezim from main
      if: steps.xezim-cache.outputs.cache-hit != 'true'
      env:
        # cargo's libgit2 does not use the runner's git credential helper;
        # shelling out to git does, which is what a public repo needs.
        CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      run: |
        rustup set profile minimal
        rustup toolchain install stable
        rustup default stable
        git clone --depth 1 https://github.com/aionhw/xezim.git "$RUNNER_TEMP/xezim-src"
        ( cd "$RUNNER_TEMP/xezim-src" && cargo build --release )
        mkdir -p "$RUNNER_TEMP/xezim-prefix/bin"
        cp "$RUNNER_TEMP/xezim-src/target/release/xezim" "$RUNNER_TEMP/xezim-prefix/bin/"
        cp -r "$RUNNER_TEMP/xezim-src/include" "$RUNNER_TEMP/xezim-prefix/"

    # Saved here rather than by the post step of the restore above, so that
    # what goes into the cache is the compiled binary alone. The UVM fork
    # added below would otherwise be included when this job is the one that
    # built, and the two jobs would then cache different things under one key.
    - name: Save the xezim build
      if: steps.xezim-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/xezim-prefix
        key: xezim-${{ runner.os }}-${{ steps.rev.outputs.sha }}

    # The UVM fork the verilator leg also uses. Its src/dpi/uvm_dpi.h guards
    # the glibc-only <malloc.h> with `ifndef UVM_NO_MALLOC, which both builds
    # define; upstream Accellera does not, so on macOS the preprocessor
    # stopped at "malloc.h file not found".
    - name: Bundle the UVM fork
      run: |
        git clone --depth 1 https://github.com/Dragon-Git/uvm-verilator.git "$RUNNER_TEMP/uvm-verilator"
        mkdir -p "$RUNNER_TEMP/xezim-prefix/share/uvm"
        cp -r "$RUNNER_TEMP/uvm-verilator/src" "$RUNNER_TEMP/xezim-prefix/share/uvm/"
        # An artifact does not carry the executable bit; a restored cache may not either.
        chmod +x "$RUNNER_TEMP/xezim-prefix/bin/xezim"
        echo "$RUNNER_TEMP/xezim-prefix/bin" >> "$GITHUB_PATH"
        echo "XEZIM_PREFIX=$RUNNER_TEMP/xezim-prefix" >> "$GITHUB_ENV"
        "$RUNNER_TEMP/xezim-prefix/bin/xezim" -V

    - name: Run xezim test
      run: |
        make -f test/base_test/Makefile run SIM=xezim

    - name: Generate pyral model and register block
      run: |
        mkdir -p test/pyral_test/gen test/pyral_test/rtl
        make -f test/pyral_test/Makefile gen

    - name: Run pyral register test
      run: |
        make -f test/pyral_test/Makefile run

    - name: Run unicorn register test
      # Same register block and same APB agent as the pyral test; what drives
      # the bus is a bare-metal firmware under unicorn instead of the PyRAL
      # model. The Makefile generates the RTL and the C header itself.
      run: |
        make -f test/unicorn_test/Makefile run

    - name: Install Renode
      # The multiplatform package would cover both runners, but not every
      # release publishes it; the per-platform ones always are. pyrenode3
      # needs the directory holding Renode's .NET assemblies: the tarball's
      # top level on Linux, and the .app bundle's Contents/MacOS on macOS.
      env:
        RENODE_VERSION: 1.17.0
      run: |
        mkdir -p "$HOME/renode"
        if [ "${{ runner.os }}" = "macOS" ]; then
          curl -sSL -o /tmp/renode.dmg \
            "https://github.com/renode/renode/releases/download/v$RENODE_VERSION/renode-$RENODE_VERSION.osx-arm64-portable.dmg"
          mkdir -p /tmp/renode-mnt
          hdiutil attach /tmp/renode.dmg -mountpoint /tmp/renode-mnt -nobrowse -quiet
          cp -R /tmp/renode-mnt/Renode.app/Contents/MacOS/. "$HOME/renode"
          hdiutil detach /tmp/renode-mnt -quiet
        else
          curl -sSL -o /tmp/renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v$RENODE_VERSION/renode-$RENODE_VERSION.linux-portable.tar.gz"
          tar xzf /tmp/renode.tar.gz -C /tmp
          cp -R "/tmp/renode_$RENODE_VERSION-portable/." "$HOME/renode"
        fi
        test -f "$HOME/renode/Renode.runtimeconfig.json"
        echo "PYRENODE_PATH=$HOME/renode" >> "$GITHUB_ENV"

    - name: Run Renode register test
      # The same firmware as the unicorn test and the same UVM testbench as
      # every other register test here; Renode runs the firmware, in a process
      # of its own, instead of unicorn.
      run: |
        make -f test/renode_test/Makefile run
  # UVM version compatibility, on both simulators.
  #
  # The jobs above each run the bridge against one UVM: the fork the verilator
  # leg needs, and whatever the xezim tarball bundles. These two cover the
  # other axis - the same bridge against every UVM release the project
  # supports - so that a change here, or upstream in xezim or Verilator, shows
  # up as a version that stopped working.
  #
  # What the two legs check is not the same thing, because what they can check
  # is not. xezim interprets, so it runs the base test against each version.
  # Verilator is used for elaboration only - see the note on its job - so its
  # cells are a lint of the bridge against each version.
  #
  # They are split for cost. Under xezim a base test is about 8 s, while a
  # fresh job spends about 35 s installing dependencies; ten jobs would be ten
  # times that setup to run eighty seconds of testing, so those versions are
  # steps in one job. A lint is seconds rather than minutes but each cell still
  # pays the checkout and the Verilator install, so keeping them parallel is
  # what makes a failure point at its version without the others waiting.
  #
  # Building xezim is the one expensive step in the whole thing, so it is its
  # own job and the xezim cells consume its artifact.
  uvm-compat-build:
    runs-on: ubuntu-latest
    steps:
    - name: Resolve the xezim revision
      id: rev
      run: |
        sha=$(git ls-remote https://github.com/aionhw/xezim.git refs/heads/main | cut -f1)
        test -n "$sha" || { echo "could not resolve xezim main"; exit 1; }
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "xezim main is $sha"

    # Keyed on the exact upstream revision, so an unchanged xezim is a hit and
    # a moved one rebuilds. Nothing older than that can be reused. xezim-test
    # uses the same path and key, so the two share one build.
    - name: Restore the xezim build
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/xezim-prefix
        key: xezim-${{ runner.os }}-${{ steps.rev.outputs.sha }}

    - name: Build xezim
      if: steps.cache.outputs.cache-hit != 'true'
      env:
        # cargo's libgit2 does not use the runner's git credential helper;
        # shelling out to git does, which is what a public repo needs.
        CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      run: |
        rustup set profile minimal
        rustup toolchain install stable
        rustup default stable
        git clone --depth 1 https://github.com/aionhw/xezim.git "$RUNNER_TEMP/xezim-src"
        ( cd "$RUNNER_TEMP/xezim-src" && cargo build --release )
        mkdir -p "$RUNNER_TEMP/xezim-prefix/bin"
        cp "$RUNNER_TEMP/xezim-src/target/release/xezim" "$RUNNER_TEMP/xezim-prefix/bin/"
        cp -r "$RUNNER_TEMP/xezim-src/include" "$RUNNER_TEMP/xezim-prefix/"

    - name: Upload the xezim build
      uses: actions/upload-artifact@v7
      with:
        name: xezim-uvm-compat
        path: ${{ runner.temp }}/xezim-prefix
        retention-days: 1

  uvm-compat-verilator:
    # Elaboration only, not a build and run. Upstream UVM gains a Verilator HDL
    # backend only in 2020-3.2 - uvm_hdl.c #errors without one - so a full run
    # is impossible for the earlier releases whatever the bridge does. Lint
    # still compares the bridge's SystemVerilog surface against every version,
    # which is the signal this matrix is after, and it takes seconds rather
    # than the minutes a build does.
    #
    # No dependency on the xezim build: this leg does not use it, and waiting
    # for it would serialise two unrelated things.
    runs-on: ubuntu-latest
    strategy:
      # A version that fails says nothing about the others.
      fail-fast: false
      matrix:
        include:
          # The three that fail do so for reasons outside this bridge, which
          # docs/uvm-version-compatibility.md explains: 1.1b and 1.1c cannot
          # elaborate under any non-vendor tool, and 1.0p1 lacks three APIs the
          # bridge uses. They are cells rather than omissions so that the
          # boundary is visible and moving.
          - { uvm: uvm-1.0p1,    expect: fail }
          - { uvm: uvm-1.1a,     expect: pass }
          - { uvm: uvm-1.1b,     expect: fail }
          - { uvm: uvm-1.1c,     expect: fail }
          - { uvm: uvm-1.1d,     expect: pass }
          - { uvm: uvm-1.2,      expect: pass }
          - { uvm: uvm-2017-0.9, expect: pass }
          - { uvm: uvm-2017-1.0, expect: pass }
          - { uvm: uvm-2017-1.1, expect: pass }
          - { uvm: uvm-2020-1.0, expect: pass }
          - { uvm: uvm-2020-1.1, expect: pass }
          - { uvm: uvm-2020-2.0, expect: pass }
          - { uvm: uvm-2020-3.0, expect: pass }
          - { uvm: uvm-2020-3.1, expect: pass }
          - { uvm: uvm-2020-3.2, expect: pass }

    name: uvm-compat (verilator, ${{ matrix.uvm }})

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install '.[test]' -q

    - name: Set up Verilator
      uses: ktbarrett/setup-verilator@dev
      with:
        version: 'nightly'

    - name: Fetch UVM ${{ matrix.uvm }}
      run: |
        git clone --quiet --depth 1 --branch "${{ matrix.uvm }}" \
          https://github.com/chipsalliance/uvm-verilator.git "$RUNNER_TEMP/uvm"

    - name: Lint the bridge against UVM ${{ matrix.uvm }}
      env:
        # This leg is given the src directory itself.
        UVM_HOME: ${{ runner.temp }}/uvm/src
      run: script/uvm_compat_check.sh verilator "${{ matrix.uvm }}" "${{ matrix.expect }}" lint

  uvm-compat-xezim:
    needs: uvm-compat-build
    # Ten versions, ten steps in one job. See the note above the build job for
    # why these are not parallel cells like the Verilator ones.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install '.[test]' -q

    - name: Get the xezim build
      uses: actions/download-artifact@v8
      with:
        name: xezim-uvm-compat
        path: ${{ runner.temp }}/xezim-prefix

    - name: Make xezim runnable
      run: |
        # An artifact does not carry the executable bit.
        chmod +x "$RUNNER_TEMP/xezim-prefix/bin/xezim"
        echo "XEZIM_PREFIX=$RUNNER_TEMP/xezim-prefix" >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/xezim-prefix/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/xezim-prefix/bin/xezim" -V

    # One shallow clone per version, up front: they are 5-26 MB each, and
    # doing it here keeps each version's step to the test alone.
    - name: Fetch the UVM versions
      run: |
        for tag in uvm-1.2 uvm-2017-0.9 uvm-2017-1.0 uvm-2017-1.1 \
                   uvm-2020-1.0 uvm-2020-1.1 uvm-2020-2.0 uvm-2020-3.0 \
                   uvm-2020-3.1 uvm-2020-3.2; do
          git clone --quiet --depth 1 --branch "$tag" \
            https://github.com/chipsalliance/uvm-verilator.git "$RUNNER_TEMP/uvm/$tag" &
        done
        wait
        ls "$RUNNER_TEMP/uvm"

    # One step per version, so the run reads as a table and a failure points
    # at the version that caused it. Each step checks its own result against
    # the expectation passed to it, and is green when they agree - including
    # the one known to fail.
    # UVM_HOME is the tag directory here; this leg's Makefile appends /src.
    - name: uvm-1.2
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-1.2' }
      run: script/uvm_compat_check.sh xezim uvm-1.2 pass
    - name: uvm-2017-0.9 (known failing)
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2017-0.9' }
      run: script/uvm_compat_check.sh xezim uvm-2017-0.9 fail
    - name: uvm-2017-1.0
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2017-1.0' }
      run: script/uvm_compat_check.sh xezim uvm-2017-1.0 pass
    - name: uvm-2017-1.1
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2017-1.1' }
      run: script/uvm_compat_check.sh xezim uvm-2017-1.1 pass
    - name: uvm-2020-1.0
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2020-1.0' }
      run: script/uvm_compat_check.sh xezim uvm-2020-1.0 pass
    - name: uvm-2020-1.1
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2020-1.1' }
      run: script/uvm_compat_check.sh xezim uvm-2020-1.1 pass
    - name: uvm-2020-2.0
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2020-2.0' }
      run: script/uvm_compat_check.sh xezim uvm-2020-2.0 pass
    - name: uvm-2020-3.0
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2020-3.0' }
      run: script/uvm_compat_check.sh xezim uvm-2020-3.0 pass
    - name: uvm-2020-3.1
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2020-3.1' }
      run: script/uvm_compat_check.sh xezim uvm-2020-3.1 pass
    - name: uvm-2020-3.2
      env: { UVM_HOME: '${{ runner.temp }}/uvm/uvm-2020-3.2' }
      run: script/uvm_compat_check.sh xezim uvm-2020-3.2 pass
