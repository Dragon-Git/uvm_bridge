name: Test

on:
  push:
    branches: [ "main" ]
    tags: ["*"]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-26]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-vlt
      OBJCACHE: ccache
      SKBUILD_CMAKE_ARGS: >-
        -DCMAKE_C_COMPILER_LAUNCHER=${{ github.workspace }}/ccwrap;-DCMAKE_CXX_COMPILER_LAUNCHER=${{ github.workspace }}/ccwrap
    steps:
    - uses: actions/checkout@v7
      with:
        # setuptools_scm needs full git history to resolve the version
        # from tags; shallow clones trigger "is shallow and may cause
        # errors" warnings and produce incorrect dev versions.
        fetch-depth: 0

    - name: Set up Verilator
      uses: veryl-lang/setup-verilator@v2

    - name: Pin Verilator to a stable path
      if: runner.os == 'Linux'
      run: |
        VLT_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v verilator)")")")"
        rm -rf "$HOME/vlt-root"
        mv "$VLT_ROOT" "$HOME/vlt-root"
        echo "VERILATOR_ROOT=$HOME/vlt-root" >> "$GITHUB_ENV"
        echo "$HOME/vlt-root/bin" >> "$GITHUB_PATH"

    - name: Cache ccache (verilator tests)
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.ccache-vlt
        key: ccache-vlt-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('src/**', 'test/**', 'inc/**', 'pyproject.toml') }}
        restore-keys: ccache-vlt-${{ runner.os }}-${{ matrix.python-version }}-

    - name: Cache ccache (wheel build)
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.ccache-whl
        key: ccache-whl-${{ runner.os }}-${{ matrix.python-version }}-${{ github.sha }}
        restore-keys: ccache-whl-${{ runner.os }}-${{ matrix.python-version }}-

    - name: Install dependencies on Ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ccache g++ make
        ccache --set-config=max_size=2G
        ccache -z

    - name: Install dependencies on macOS
      if: matrix.os == 'macos-26'
      run: |
        brew install ccache
        ccache --set-config=max_size=2G
        ccache -z

    - name: Clone verilator-uvm repository
      run: |
        git clone https://github.com/Dragon-Git/uvm-verilator.git

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up ccache wheel wrapper
      run: |
        printf '#!/bin/sh\nCCACHE_DIR=%s/.ccache-whl exec ccache "$@"\n' "${{ github.workspace }}" > "${{ github.workspace }}/ccwrap"
        chmod +x "${{ github.workspace }}/ccwrap"
        CCACHE_DIR="${{ github.workspace }}/.ccache-whl" ccache --set-config=max_size=500M
        CCACHE_DIR="${{ github.workspace }}/.ccache-whl" ccache -z

    - name: Install Python dependencies
      # nanobind 3.0.0 (Aug 2026) raises ImportError at import
      # time on Python < 3.10 because its stable ABI floor
      # moved up to 3.10. pyproject.toml advertises
      # nanobind>=2.4.0,<4.0.0 (per Dependabot PR #26) which
      # pip happily resolves to 3.0.0 even on Python 3.9,
      # causing the wheel build to fail. On 3.9 we constrain
      # pip (in both the main and the isolated build env) to
      # nanobind 2.4.x via a PEP 665-style constraints file
      # written to a temp file. PIP_CONSTRAINT applies to
      # every pip invocation in this step, including the
      # build-time resolver that PEP 517's isolated build
      # creates, so the sdist build cannot re-resolve
      # nanobind to 3.0.0. On every other Python version
      # PIP_CONSTRAINT is not set, so 3.0.0 is picked
      # normally.
      run: |
        python -m pip install --upgrade pip
        if [ "${{ matrix.python-version }}" = "3.9" ]; then
          printf '%s\n%s\n' 'nanobind==2.4.0' 'nanobind-backend==2.4.0' > /tmp/nb39.txt
          PIP_CONSTRAINT=/tmp/nb39.txt python -m pip install . -v
        else
          python -m pip install . -v
        fi
        python -m pip install cocotb

    - name: Lint with ruff
      uses: astral-sh/ruff-action@v4.1.0

    - name: Run base test
      run: |
        make -f test/base_test/Makefile run

    - name: Run cocotb test
      run: |
        make -f test/cocotb_test/Makefile run

    - name: Show ccache stats
      run: |
        echo "== verilator tests =="
        CCACHE_DIR="${{ github.workspace }}/.ccache-vlt" ccache -s
        echo "== wheel build =="
        CCACHE_DIR="${{ github.workspace }}/.ccache-whl" ccache -s

  xezim-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            xezim_asset: xezim-manylinux_2_34_x86_64-0.11.0.tar.gz
          - os: macos-26
            xezim_asset: xezim-macos-arm64-0.11.0.tar.gz
    env:
      XEZIM_VERSION: 0.11.0
    steps:
    - uses: actions/checkout@v7
      with:
        # setuptools_scm needs full git history to resolve the version
        # from tags; shallow clones trigger "is shallow and may cause
        # errors" warnings and produce incorrect dev versions.
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install . -v

    # TODO: restore this once a release newer than 0.11.0 is published, and
    # drop the source build below. Kept here so the switch back is a one-liner.
    # - name: Install xezim
    #   run: |
    #     curl -fL --retry 3 -o /tmp/xezim.tar.gz \
    #       "https://github.com/EDAPack/xezim-bin/releases/download/v${XEZIM_VERSION}/${{ matrix.xezim_asset }}"
    #     tar -xzf /tmp/xezim.tar.gz -C "$HOME"
    #     echo "$HOME/xezim/bin" >> "$GITHUB_PATH"
    #     echo "XEZIM_PREFIX=$HOME/xezim" >> "$GITHUB_ENV"

    - name: Build xezim from main
      env:
        # cargo's libgit2 does not use the runner's git credential helper;
        # shelling out to git does, which is what a public repo needs.
        CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      run: |
        rustup set profile minimal
        rustup toolchain install stable
        rustup default stable
        git clone --depth 1 https://github.com/aionhw/xezim.git /tmp/xezim-src
        # Same UVM fork the verilator leg uses. Its src/dpi/uvm_dpi.h guards
        # the glibc-only <malloc.h> with `ifndef UVM_NO_MALLOC, which both
        # builds define; upstream Accellera does not, so on macOS the
        # preprocessor stopped at "malloc.h file not found".
        git clone --depth 1 https://github.com/Dragon-Git/uvm-verilator.git /tmp/uvm-verilator
        cd /tmp/xezim-src
        cargo build --release
        mkdir -p "$HOME/xezim/share/uvm"
        cp -r /tmp/uvm-verilator/src "$HOME/xezim/share/uvm/"
        mkdir -p "$HOME/xezim/bin"
        cp /tmp/xezim-src/target/release/xezim "$HOME/xezim/bin/"
        cp -r /tmp/xezim-src/include "$HOME/xezim/"
        echo "$HOME/xezim/bin" >> "$GITHUB_PATH"
        echo "XEZIM_PREFIX=$HOME/xezim" >> "$GITHUB_ENV"
        "$HOME/xezim/bin/xezim" -V

    - name: Run xezim test
      run: |
        make -f test/base_test/Makefile run SIM=xezim

    - name: Install peakrdl
      # peakrdl-pyral brings the cli + systemrdl front-end; the regblock
      # exporter that turns the same .rdl into RTL is a separate plugin.
      run: |
        python -m pip install 'peakrdl-pyral[cli]' peakrdl-pyral-runtime peakrdl-regblock

    - name: Generate pyral model and register block
      run: |
        mkdir -p test/pyral_test/gen test/pyral_test/rtl
        make -f test/pyral_test/Makefile gen

    - name: Run pyral register test
      run: |
        make -f test/pyral_test/Makefile run
