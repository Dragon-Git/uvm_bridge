name: Test

on:
  push:
    branches: [ "main" ]
    tags: ["*"]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.14 is kept in the matrix. cocotb 2.0.1 (latest
        # stable on PyPI as of 2026-08) hard-codes
        # python_requires="<=3.13" in its pyproject.toml and
        # rejects 3.14 at install time, so we set
        # COCOTB_IGNORE_PYTHON_REQUIRES=True in the "Install
        # Python dependencies" step to bypass that check.
        # 2.0.1 also publishes a prebuilt macOS ARM64 wheel, so
        # no sdist build is needed on macos-26.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-26]
        # Temporary gate: the (macos-26, 3.14) cell is excluded
        # because cocotb 2.0.1 does not publish a cp314 wheel
        # on PyPI, so pip falls back to the 2.0.x sdist and hits
        # the LTO + -bundle link error:
        #   ld: unsupported mach-o filetype ... in 'libgpilog.so'
        # cocotb master (>= commit b58c5e73) and cocotb 2.1 (when
        # released) fix this. Track the re-enable in the issue
        # referenced in c5245c1's commit message and restore
        # this entry once 2.1 ships a stable cp314 macOS ARM64
        # wheel.
        exclude:
          - os: macos-26
            python-version: "3.14"
    steps:
    - uses: actions/checkout@v7
      with:
        # setuptools_scm needs full git history to resolve the version
        # from tags; shallow clones trigger "is shallow and may cause
        # errors" warnings and produce incorrect dev versions.
        fetch-depth: 0

    - name: Cache verilator (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/cache@v6
      env:
        cache-name: cache-verilator-new
      with:
        path: /home/runner/work/verilator
        key: verilator-v5${{ env.cache-name }}

    - name: Install dependencies on Ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends help2man make g++ perl python3 autoconf flex bison libfl2 libfl-dev zlib1g zlib1g-dev
        sudo bash ./script/install_verilator.sh

    - name: Install dependencies on macOS (arm64)
      if: matrix.os == 'macos-26'
      env:
        # Homebrew 5.x requires explicit trust for third-party taps
        # (e.g. aws/tap) that older macOS-26 images don't pre-trust.
        # The trust requirement is a non-essential safety check; we
        # only install verilator from the default tap, so we skip it.
        HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
      run: |
        export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
        brew update
        brew install verilator

    - name: Clone verilator-uvm repository
      run: |
        git clone https://github.com/Dragon-Git/uvm-verilator.git
        cd uvm-verilator
        git checkout patch

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      env:
        # cocotb 2.0.1 (the latest stable on PyPI as of 2026-08)
        # hard-codes python_requires="<=3.13" in its pyproject.toml.
        # Setting this bypasses that check so the install can
        # proceed on Python 3.14. cocotb itself runs fine on
        # 3.14 -- the constraint is a stale guard in 2.0.x's
        # build metadata. cocotb 2.1 / master removed the
        # constraint; once 2.1 ships a stable 3.14 wheel on
        # PyPI we can drop this and pin to cocotb==2.1 instead.
        COCOTB_IGNORE_PYTHON_REQUIRES: "True"
      run: |
        python -m pip install --upgrade pip
        python -m pip install . -v
        # Pin to cocotb 2.0.1 instead of pulling from master:
        # 2.0.1 ships a prebuilt macOS ARM64 wheel, so the
        # macos-26 + Py3.14 LTO + -bundle link error from the
        # 2.0.x sdist is no longer in the picture. The Py3.14
        # gate is still active in 2.0.1's python_requires field,
        # which is why we set COCOTB_IGNORE_PYTHON_REQUIRES above.
        python -m pip install cocotb==2.0.1

    - name: Lint with ruff
      uses: astral-sh/ruff-action@v4.1.0

    - name: Run base test
      run: |
        make -f test/base_test/Makefile run

    - name: Run cocotb test
      run: |
        make -f test/cocotb_test/Makefile run
