# Builds xezim at one revision and nothing else, for bisecting a regression
# against a binary the project did not build itself. The revision is an input
# rather than the head of main, and the job only uploads an artifact: no cache,
# no test, so an old revision cannot displace the build the suites use.
name: xezim bisect build

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Upstream xezim revision to build
        required: true
        type: string
      os:
        description: Runner label to build on
        required: false
        type: string
        default: ubuntu-24.04-arm

jobs:
  build:
    uses: ./.github/workflows/xezim-build.yml
    with:
      os: ${{ inputs.os }}
      sha: ${{ inputs.sha }}
