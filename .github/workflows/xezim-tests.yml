# The xezim test suite, on one runner. Split out of test.yml so each
# architecture can call it and depend on its own build job alone: `needs`
# covers a whole job including all of its matrix cells.
name: xezim tests

on:
  workflow_call:
    inputs:
      os:
        description: Runner label to run the suite on; the cell of its build job.
        required: true
        type: string

jobs:
  xezim-test:
    runs-on: ${{ inputs.os }}
    # The artifact is built from xezim main, which is newer than this release.
    env:
      XEZIM_VERSION: 0.11.1
    steps:
    - uses: actions/checkout@v7
      with:
        # setuptools_scm needs the tags to resolve the version.
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # The test extra carries what the register tests need to build their
        # inputs: peakrdl (RTL, C header, PyRAL model) and unicorn.
        python -m pip install . --group test -v

    # Named after this job's own runner, i.e. the build job it needs.
    - name: Get the xezim build
      uses: actions/download-artifact@v8
      with:
        name: xezim-${{ runner.os }}-${{ runner.arch }}
        path: ${{ runner.temp }}/xezim-prefix

    # The UVM fork the verilator leg also uses: its uvm_dpi.h guards the
    # glibc-only <malloc.h> with `ifndef UVM_NO_MALLOC, which both builds
    # define and upstream Accellera does not, so on macOS the preprocessor
    # stopped at "malloc.h file not found". Bundled per consumer so that the
    # build job caches and uploads the binary alone.
    - name: Bundle the UVM fork
      run: |
        git clone --depth 1 https://github.com/Dragon-Git/uvm-verilator.git "$RUNNER_TEMP/uvm-verilator"
        mkdir -p "$RUNNER_TEMP/xezim-prefix/share/uvm"
        cp -r "$RUNNER_TEMP/uvm-verilator/src" "$RUNNER_TEMP/xezim-prefix/share/uvm/"
        # An artifact does not carry the executable bit.
        chmod +x "$RUNNER_TEMP/xezim-prefix/bin/xezim"
        echo "$RUNNER_TEMP/xezim-prefix/bin" >> "$GITHUB_PATH"
        echo "XEZIM_PREFIX=$RUNNER_TEMP/xezim-prefix" >> "$GITHUB_ENV"
        "$RUNNER_TEMP/xezim-prefix/bin/xezim" -V

    - name: Run xezim test
      run: |
        pytest -v test/base_test
      env:
        SVUVM_BACKENDS: xezim

    - name: Run RAL pyral (xezim)
      # peakrdl artefacts used to be built by a separate `make gen` step.
      # The session-scoped `artifacts` fixture now generates and caches them,
      # so each suite is one pytest invocation. RAL_STRICT=1 makes a missing
      # prerequisite a hard failure instead of a quiet skip.
      run: |
        SVUVM_BACKENDS=xezim RAL_STRICT=1 python3 -m pytest -v test/pyral_test -m ral

    - name: Run RAL unicorn (xezim)
      # Same register block and APB agent as pyral; the bus is driven by
      # bare-metal firmware under unicorn instead of the PyRAL model.
      run: |
        SVUVM_BACKENDS=xezim RAL_STRICT=1 python3 -m pytest -v test/unicorn_test -m ral

    - name: Install Renode
      # Per-platform packages rather than the multiplatform one, which not
      # every release publishes: "linux-portable" on x86_64,
      # "linux-arm64-portable" on arm64, both unpacking to the same top level.
      env:
        RENODE_VERSION: 1.17.0
      run: |
        mkdir -p "$HOME/renode"
        if [ "${{ runner.os }}" = "macOS" ]; then
          curl -sSL -o /tmp/renode.dmg \
            "https://github.com/renode/renode/releases/download/v$RENODE_VERSION/renode-$RENODE_VERSION.osx-arm64-portable.dmg"
          mkdir -p /tmp/renode-mnt
          hdiutil attach /tmp/renode.dmg -mountpoint /tmp/renode-mnt -nobrowse -quiet
          cp -R /tmp/renode-mnt/Renode.app/Contents/MacOS/. "$HOME/renode"
          hdiutil detach /tmp/renode-mnt -quiet
        else
          if [ "$(uname -m)" = "x86_64" ]; then
            renode_pkg="linux-portable"
          else
            renode_pkg="linux-arm64-portable"
          fi
          curl -sSL -o /tmp/renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v$RENODE_VERSION/renode-$RENODE_VERSION.$renode_pkg.tar.gz"
          tar xzf /tmp/renode.tar.gz -C /tmp
          cp -R "/tmp/renode_$RENODE_VERSION-portable/." "$HOME/renode"
        fi
        test -f "$HOME/renode/Renode.runtimeconfig.json"
        echo "PYRENODE_PATH=$HOME/renode" >> "$GITHUB_ENV"

    - name: Run RAL renode (xezim)
      # The same firmware as the unicorn test, run by Renode in a process of
      # its own. PYRENODE_PATH comes from the Install Renode step above; the
      # renode conftest guard checks it together with pyrenode3, and
      # RAL_STRICT=1 turns any missing prerequisite into an explicit failure
      # (exit 1 at fixture setup), never a silent skip.
      run: |
        SVUVM_BACKENDS=xezim RAL_STRICT=1 python3 -m pytest -v test/renode_test -m ral

    # The renode verilator leg belongs here, next to the Renode/.NET install
    # and the `renode` dependency group already present via `--group test`.
    # Putting it in test.yml's 6x3 verilator matrix would force pyrenode3's
    # git URL onto every cell (design §7.3 / §11-5) and duplicate the Renode
    # download. Per §11-6 only the representative cell runs it: this reusable
    # workflow is pinned to Python 3.12, so the OS gate is sufficient.
    - name: Set up Verilator for renode verilator leg
      if: inputs.os == 'ubuntu-24.04'
      uses: ktbarrett/setup-verilator@dev
      with:
        version: 'nightly'

    - name: Bundle UVM fork for verilator leg
      if: inputs.os == 'ubuntu-24.04'
      # sim_runner's DEFAULT_UVM_HOME is <repo>/uvm-verilator/src. Reuse the
      # fork cloned by "Bundle the UVM fork" above; no second clone needed.
      # GitHub's ubuntu runners already provide g++/make for the C++ build.
      run: |
        verilator --version
        mkdir -p "$GITHUB_WORKSPACE/uvm-verilator"
        cp -r "$RUNNER_TEMP/uvm-verilator/src" "$GITHUB_WORKSPACE/uvm-verilator/"
        test -f "$GITHUB_WORKSPACE/uvm-verilator/src/uvm_pkg.sv"

    - name: Run RAL renode (verilator, representative cell)
      if: inputs.os == 'ubuntu-24.04'
      # Strict by default: missing pyrenode3 / PYRENODE_PATH / Renode runtime
      # fails at setup (exit 1), and a broken verilator+Renode combination is
      # red too - it is NOT hidden by the renode_verilator_unsupported marker.
      # If CI proves that combination infeasible (design §5.4 L1), mark the
      # renode replay tests with that marker and change this invocation to
      # `-m "ral and not renode_verilator_unsupported"` plus an explicit
      # diagnostic step printing the reason. Never just drop this step: that
      # would make the requested dual backend silent fiction.
      run: |
        SVUVM_BACKENDS=verilator RAL_STRICT=1 python3 -m pytest -v test/renode_test -m ral
